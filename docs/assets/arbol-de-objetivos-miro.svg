<svg viewBox="0 0 968 910" width="968" height="910" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="968" height="910" fill="#ffffff"/><text x="484.0" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a">Arbol de Objetivos - brainstorm original (Miro)</text><text x="484.0" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">Brainstorm original en Miro (post-its), previo a la formalizacion C1-C4 / OE-M y al pivot a Dermalia</text><text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">Efectos / Fines</text><rect x="40" y="90" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="141.0">Aumentar la rentabilidad y</tspan><tspan x="145.0" y="158.0">el crecimiento del negocio</tspan></text><rect x="266" y="90" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="141.0">Liberar tiempo del dueño</tspan><tspan x="371.0" y="158.0">para atender clientas</tspan></text><rect x="492" y="90" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="597.0" y="141.0">Permitir que el dueño se</tspan><tspan x="597.0" y="158.0">enfoque en el servicio</tspan></text><rect x="718" y="90" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="823.0" y="132.5">Atraer clientes</tspan><tspan x="823.0" y="149.5">potenciales con atencion</tspan><tspan x="823.0" y="166.5">agil</tspan></text><rect x="40" y="216" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="267.0">Eficiencia al contestar</tspan><tspan x="145.0" y="284.0">mensajes</tspan></text><rect x="266" y="216" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="258.5">Respuestas dentro del</tspan><tspan x="371.0" y="275.5">horario de trabajo</tspan><tspan x="371.0" y="292.5">instantaneas</tspan></text><rect x="492" y="216" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="597.0" y="267.0">Ayuda al cliente sin</tspan><tspan x="597.0" y="284.0">necesidad del dueño</tspan></text><rect x="718" y="216" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="823.0" y="267.0">Tiempo de trabajo perdido</tspan><tspan x="823.0" y="284.0">nulo o casi nulo</tspan></text><rect x="40" y="342" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="393.0">Menos confusiones para el</tspan><tspan x="145.0" y="410.0">dueño</tspan></text><rect x="266" y="342" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="384.5">Mejor asignacion de turnos</tspan><tspan x="371.0" y="401.5">evitando que se pierdan</tspan><tspan x="371.0" y="418.5">turnos en el dia</tspan></text><rect x="347.5" y="498" width="273.0" height="90" rx="10" fill="#ea94bb" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a"><tspan x="484.0" y="521.0">Mejorar la atencion al cliente,</tspan><tspan x="484.0" y="539.0">aliviar la carga para el dueño y</tspan><tspan x="484.0" y="557.0">generar mas alcance para el</tspan><tspan x="484.0" y="575.0">negocio</tspan></text><text x="40" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#854d0e">Causas / Medios</text><rect x="40" y="634" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="676.5">Contar con un sistema de</tspan><tspan x="145.0" y="693.5">reservas con horarios</tspan><tspan x="145.0" y="710.5">visibles</tspan></text><rect x="266" y="634" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="685.0">Mejor experiencia para el</tspan><tspan x="371.0" y="702.0">usuario</tspan></text><rect x="492" y="634" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="597.0" y="676.5">Crear una pagina web que</tspan><tspan x="597.0" y="693.5">ayude a los clientes a</tspan><tspan x="597.0" y="710.5">reservar turnos</tspan></text><rect x="718" y="634" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="823.0" y="676.5">Hacer un chatbot mediante</tspan><tspan x="823.0" y="693.5">WhatsApp que conteste en</tspan><tspan x="823.0" y="710.5">los horarios de trabajo</tspan></text><rect x="40" y="760" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="811.0">Cobrar y confirmar seña al</tspan><tspan x="145.0" y="828.0">reservar</tspan></text><rect x="266" y="760" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="811.0">Enviar recordatorio</tspan><tspan x="371.0" y="828.0">automatico de turno</tspan></text><rect x="492" y="760" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="597.0" y="802.5">Contar con respuestas</tspan><tspan x="597.0" y="819.5">automaticas para precios y</tspan><tspan x="597.0" y="836.5">protocolos</tspan></text><rect x="718" y="760" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="823.0" y="811.0">Integrar WhatsApp con una</tspan><tspan x="823.0" y="828.0">agenda digital</tspan></text></svg>