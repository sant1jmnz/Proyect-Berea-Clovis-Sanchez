<svg viewBox="0 0 968 910" width="968" height="910" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="968" height="910" fill="#ffffff"/><text x="484.0" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a">Arbol de Problemas - brainstorm original (Miro)</text><text x="484.0" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">Brainstorm original en Miro (post-its), previo a la formalizacion C1-C4 / OE-M y al pivot a Dermalia</text><text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">Efectos / Fines</text><rect x="40" y="90" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="132.5">Menor rentabilidad y</tspan><tspan x="145.0" y="149.5">crecimiento limitado del</tspan><tspan x="145.0" y="166.5">negocio</tspan></text><rect x="266" y="90" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="132.5">Perdida de tiempo que</tspan><tspan x="371.0" y="149.5">podria dedicarse a atender</tspan><tspan x="371.0" y="166.5">clientas</tspan></text><rect x="492" y="90" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="597.0" y="141.0">El dueño no puede</tspan><tspan x="597.0" y="158.0">enfocarse en el servicio</tspan></text><rect x="718" y="90" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="823.0" y="132.5">Clientes potenciales</tspan><tspan x="823.0" y="149.5">eligen negocios con</tspan><tspan x="823.0" y="166.5">atencion mas agil</tspan></text><rect x="40" y="216" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="258.5">Algunas respuestas tardias</tspan><tspan x="145.0" y="275.5">y fuera del horario de</tspan><tspan x="145.0" y="292.5">trabajo</tspan></text><rect x="266" y="216" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="250.0">Mucho tiempo de trabajo</tspan><tspan x="371.0" y="267.0">perdido por contestar</tspan><tspan x="371.0" y="284.0">mensajes o asignar</tspan><tspan x="371.0" y="301.0">reservas</tspan></text><rect x="492" y="216" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="597.0" y="267.0">Genera confusion para el</tspan><tspan x="597.0" y="284.0">dueño</tspan></text><rect x="718" y="216" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="823.0" y="267.0">Menor satisfaccion de las</tspan><tspan x="823.0" y="284.0">clientas actuales</tspan></text><rect x="40" y="342" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="401.5">Produce turnos perdidos</tspan></text><rect x="266" y="342" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="401.5">Produce superposiciones</tspan></text><rect x="492" y="342" width="210" height="110" rx="10" fill="#93d275" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="597.0" y="384.5">Ineficiencia al contestar</tspan><tspan x="597.0" y="401.5">mensajes y al asignar</tspan><tspan x="597.0" y="418.5">turnos</tspan></text><rect x="347.5" y="498" width="273.0" height="90" rx="10" fill="#ea94bb" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a1a1a"><tspan x="484.0" y="530.0">La gestion de turnos y consultas</tspan><tspan x="484.0" y="548.0">depende de la atencion manual del</tspan><tspan x="484.0" y="566.0">dueño por WhatsApp</tspan></text><text x="40" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#854d0e">Causas / Medios</text><rect x="40" y="634" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="676.5">No hay un sistema de</tspan><tspan x="145.0" y="693.5">reservas con horarios</tspan><tspan x="145.0" y="710.5">visibles</tspan></text><rect x="266" y="634" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="685.0">Atencion manual por el</tspan><tspan x="371.0" y="702.0">dueño mediante WhatsApp</tspan></text><rect x="492" y="634" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="597.0" y="685.0">Cantidad de tiempo que</tspan><tspan x="597.0" y="702.0">toma contestar mensajes</tspan></text><rect x="718" y="634" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="823.0" y="693.5">Sin disponibilidad 24/7</tspan></text><rect x="40" y="760" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="145.0" y="811.0">No se cobra ni confirma</tspan><tspan x="145.0" y="828.0">seña al reservar</tspan></text><rect x="266" y="760" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="371.0" y="811.0">No hay recordatorio</tspan><tspan x="371.0" y="828.0">automatico de turno</tspan></text><rect x="492" y="760" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="597.0" y="802.5">No existe una base de</tspan><tspan x="597.0" y="819.5">respuestas para precios y</tspan><tspan x="597.0" y="836.5">protocolos</tspan></text><rect x="718" y="760" width="210" height="110" rx="10" fill="#f5d128" stroke="#00000022"/><text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan x="823.0" y="811.0">WhatsApp no esta integrado</tspan><tspan x="823.0" y="828.0">a ninguna agenda digital</tspan></text></svg>